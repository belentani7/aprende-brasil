name: E2E (navegador real)

# Testes de ponta a ponta com Chromium real contra o build estático servido
# pelo `vite preview`. Rodam em PR e em main: são a rede de segurança para
# rotas profundas, atividades, progresso e PWA — coisas que o JSDOM não prova.
#
# Diferença deliberada em relação ao job `web` do CI: aqui o navegador é real,
# com CSS, layout, service worker e navegação de verdade.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Build estático
        run: npm run build

      - name: Lighthouse CI (performance e acessibilidade reais)
        # Roda contra dist/public com a configuração de `lighthouserc.cjs`.
        # Performance < 95 ou acessibilidade < 95 reprovam o PR de propósito.
        run: npx --yes @lhci/cli@0.14.x autorun 2>&1 | tee /tmp/lighthouse.txt

      - name: Testes Playwright
        # `--reporter=list` mantém a saída legível no log; o HTML fica no artifact.
        run: npx playwright test 2>&1 | tee /tmp/playwright.txt

      - name: Explicar falhas no PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Esta execução falhou'
            echo
            for arquivo in /tmp/lighthouse.txt /tmp/playwright.txt; do
              [ -s "$arquivo" ] || continue
              echo "<details><summary>$(basename "$arquivo")</summary>"
              echo
              echo '```'
              grep -vE '^\s*$' "$arquivo" | tail -n 120 || true
              echo '```'
              echo '</details>'
            done
          } > /tmp/comentario.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comentario.md

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
