name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - name: Verificar privacidad antes de instalar dependencias
        run: node --test scripts/assert-no-debug-collector.test.mjs
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Verificar currículo exportado
        run: python -m scripts.export_curriculum --check
      - name: Lint
        run: pnpm run --if-present lint
      - name: Typecheck
        run: pnpm run --if-present typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm run --if-present build
