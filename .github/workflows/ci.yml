name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Frontend (check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Exportar currículo e verificar sincronização
        run: npm run curriculum:check

      - name: Typecheck
        run: npm run check

      - name: Testes unitários e de integração
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Orçamento de bundle e contrato dos dados
        run: npm run audit

      - name: Guardar build
        uses: actions/upload-artifact@v7
        with:
          name: dist-public
          path: dist/public
          retention-days: 7

  api:
    name: Conteúdo e API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements-dev.txt

      - name: Verificar exportação determinística
        run: |
          python3 scripts/export_static_curriculum.py --check
          git diff --exit-code -- client/src/data

      - name: Suite Python (API, dados, conteúdo)
        run: python -m pytest
